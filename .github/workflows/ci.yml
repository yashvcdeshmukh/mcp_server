name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest
