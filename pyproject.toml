[project]
name = "equipment-mcp"
version = "0.1.0"
description = "MCP server and local ReAct agent for IT equipment requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "ollama>=0.6.3",
]

[project.scripts]
equipment-mcp = "equipment_mcp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
